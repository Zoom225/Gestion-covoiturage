# L'activation simultanée de prod ne doit jamais exposer la documentation.
spring.config.activate.on-profile=dev & !prod

# PostgreSQL local ; l'utilisateur reste défini dans la configuration commune.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:15432/carshare}
spring.datasource.password=${DB_PASSWORD}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
server.address=127.0.0.1

# Development default only; this profile is inactive whenever prod is active.
driveconnect.security.invitation.ttl=${INVITATION_TTL:PT24H}
