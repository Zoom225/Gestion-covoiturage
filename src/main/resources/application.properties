spring.application.name=carshare-network

# PostgreSQL connection. Override these values through the process environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carshare}
spring.datasource.username=${DB_USERNAME:carshare}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns schema changes; Hibernate only checks the mapped schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Required signing key: Base64 encoding of at least 32 cryptographically random bytes.
driveconnect.security.jwt.secret=${JWT_SECRET:}
driveconnect.security.jwt.issuer=${JWT_ISSUER:driveconnect}
driveconnect.security.jwt.audience=${JWT_AUDIENCE:driveconnect-api}
driveconnect.security.jwt.ttl=${JWT_TTL:PT15M}
driveconnect.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Version injectée par le filtrage Maven déjà fourni par le parent Spring Boot.
driveconnect.api.version=@project.version@

# La documentation HTTP est fermée par défaut ; seul le profil dev l'active.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
