# ===== Database (PostgreSQL Docker) =====
# Local development: transportService database, transport/transport credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/transportService}
spring.datasource.username=${DB_USER:transport}
spring.datasource.password=${DB_PASSWORD:transport}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.allow-bean-definition-overriding=true

# ===== Server =====
server.port=8080

# ===== JWT Configuration =====
# Fallback local 256-bit dev secret when JWT_SECRET env var is not defined
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
transport.reservation.delai-paiement=${RESERVATION_PAYMENT_TTL:PT30M}
transport.restriction.duree-jours=${RESTRICTION_DAYS:7}
transport.penalites.annulation-tardive.active=${LATE_CANCELLATION_ENABLED:false}
transport.penalites.annulation-tardive.seuil-heures=${LATE_CANCELLATION_HOURS:24}
transport.penalites.absence.active=${NO_SHOW_PENALTY_ENABLED:false}
transport.penalites.chauffeur.active=${DRIVER_CANCELLATION_PENALTY_ENABLED:false}
transport.penalites.chauffeur.seuil-nombre=${DRIVER_CANCELLATION_THRESHOLD:3}
transport.penalites.chauffeur.fenetre-jours=${DRIVER_CANCELLATION_WINDOW_DAYS:30}

# ===== Swagger / OpenAPI Configuration =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===== H2 Console (désactivée) =====
spring.h2.console.enabled=false
