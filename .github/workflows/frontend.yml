name: Frontend

on:
  push:
    branches: [master, 'fonctionnalite/frontend-socle-authentification']
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  validation:
    name: Compiler et tester Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Compiler en production
        run: npm run build
      - name: Exécuter les tests unitaires
        run: npm test -- --watch=false
      - name: Préparer Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérifier les parcours, le responsive et l’accessibilité
        run: npm run test:e2e
      - name: Conserver le rapport de recette
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-frontend
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
