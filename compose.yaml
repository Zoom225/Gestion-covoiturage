name: driveconnect-dev

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: carshare
      POSTGRES_USER: ${DB_USERNAME:-carshare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?carshare}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
